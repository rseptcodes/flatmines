<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flatmines!</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="flatMines.css">
        <script type="module" src="./flatMines/main.js"></script>

</head>
<body>
<div class="container">
    <h1>FlatMines</h1>
    <p class="subtitle">Good luck.</p>

<div class="placar">
    <div class="placar-item">Time: <span id="score-time">0</span>s</div>
    <div class="placar-item">Flags: <span id="score-flags">0</span></div>
    <div class="placar-item">Streak: <span id="score-streak">0</span></div>
</div>

    <div id="boardsContainer" class="boardsContainer">
    <div id="lastBoard" class="board board--previewCopy"></div>
    <div id="board" class="board"></div>
    <div id="nextBoard" class="board board--nextCopy"></div>
</div>
    
<div class="footer">
    <button id="resetBtn" class="tooltip" data-tooltip="Reset">
        <span class="fa-solid fa-arrows-rotate"></span>
    </button>

    <button id="tilesDesignBtn" class="tooltip" data-tooltip="Tile Design">
        <i class="fa-solid fa-4"></i>
    </button>

    <button id="configBtn" class="tooltip" data-tooltip="Settings">
        <i class="fa-solid fa-gear"></i>
    </button>

    <button class="solverBtn--hidden tooltip" id="solverBtn" data-tooltip="Auto Solver">
        <i class="fa-solid fa-brain"></i>
    </button>
</div>

<div id="configMenu" class="configMenu configMenu--hidden">
    <div class="difficultyButtons">
        <button id="easyButton" class="tooltip" data-tooltip="Easy">
            <i class="fa-solid fa-seedling"></i>
        </button>

        <button id="mediumButton" class="tooltip" data-tooltip="Medium">
            <i class="fa-solid fa-fire"></i>
        </button>

        <button id="hardButton" class="tooltip" data-tooltip="Hard">
            <i class="fa-solid fa-skull"></i>
        </button>
    </div>

    <button id="solverManager" class="tooltip" data-tooltip="Toggle AI Solver">
        Enable AI solver
    </button>
</div>
    </div>
    </div>
</body>
</html>
